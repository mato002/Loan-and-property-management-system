<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#059669">
    <title>Offline</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            font-family: system-ui, sans-serif;
            background: #f8fafc;
            color: #111827;
        }
        main { text-align: center; padding: 2rem; max-width: 24rem; }
        h1 { font-size: 1.5rem; margin: 0 0 0.5rem; }
        p { color: #4b5563; line-height: 1.5; }
        a {
            display: inline-block;
            margin-top: 1rem;
            background: #059669;
            color: #fff;
            text-decoration: none;
            font-weight: 700;
            padding: 0.75rem 1.25rem;
            border-radius: 0.75rem;
        }
    </style>
</head>
<body>
    <main>
        <h1>You are offline</h1>
        <p>Reconnect to browse listings, payments, and the rest of the site. Then open this page again.</p>
        <a href="./">Try again</a>
    </main>
</body>
</html>
